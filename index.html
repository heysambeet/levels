<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levels</title>
<meta name="description" content="A watchlist of Indian companies against their 50/100/200-day averages and 52-week range, with RSI and the news behind each move.">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Levels">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A0A0B'/><g stroke='%23CCFF00' stroke-width='2.4' stroke-linecap='round'><path d='M7 10h18'/><path d='M7 22h18'/></g><circle cx='19' cy='16' r='2.6' fill='%23F4F4F5'/><path d='M7 16h18' stroke='%238A8A93' stroke-width='1.2' stroke-dasharray='2 3'/></svg>">

<style>
/* Mulish carries the wordmark — the owner asked for Avenir or an equivalent
   from Google Fonts, and Avenir itself is commercial. Mulish is the closest
   free match to Avenir Next: geometric-humanist, near-circular rounds. */
@font-face{font-family:Mulish;src:url(fonts/Mulish.ttf) format('truetype-variations');font-weight:200 1000;font-display:swap}
@font-face{font-family:WorkSans;src:url(fonts/WorkSans.ttf) format('truetype-variations');font-weight:100 900;font-display:swap}

:root{
  --bg:#0A0A0B; --card:#141416; --raised:#1C1C1F; --rule:#232326;
  --ink:#F4F4F5; --muted:#8A8A93; --faint:#5E5E66;
  --lime:#CCFF00; --up:#34D07F; --down:#FF5C5C;
  --pad:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:WorkSans,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.45; font-weight:400;
  /* tnum keeps price columns from jittering as digits change; zero is the
     slashed zero. Both are present in Work Sans — checked before switching,
     because a numbers-heavy page set in a proportional-figure face reflows
     on every refresh. Inter's cv05/ss03 are dropped: those tags mean
     something different in Work Sans. */
  font-feature-settings:'tnum' 1,'zero' 1;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + var(--safe-b));
  overscroll-behavior-y:contain;
}
/* Desktop gets the phone layout, clamped to a centred column — same rule
   Market Nudge locked. 430px is the design-target phone width, so the page
   is one layout everywhere rather than a mobile one and a desktop one. */
.wrap{max-width:430px;margin:0 auto;padding:0 var(--pad)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------------- chrome ---------------- */
header{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-top:env(safe-area-inset-top,0px)}
.hair{height:.5px;background:var(--rule);opacity:0;transition:opacity .16s}
header.stuck .hair{opacity:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{font-family:Mulish,-apple-system,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand i{color:var(--lime);font-style:normal}
.idx{text-align:right;line-height:1.25}
.idx .nm{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.idx .v{font-size:15px;font-weight:600}
.idx .c{font-size:11.5px;font-weight:600}
.statusline{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint);padding:0 0 10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.dot.open{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.statusline .sp{margin-left:auto}
#age{color:var(--muted)}
#age.stale{color:#FFB86B}

/* ---------------- controls ---------------- */
.controls{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.searchrow{display:flex;gap:8px}
input[type=search]{
  flex:1;background:var(--card);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;-webkit-appearance:none;min-width:0;
}
input[type=search]:focus{outline:none;border-color:#3a3a40;background:var(--raised)}
input[type=search]::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;margin:0 calc(var(--pad)*-1);padding-inline:var(--pad)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--rule);color:var(--muted);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:background .12s,color .12s}
.chip[aria-pressed=true]{background:var(--raised);color:var(--ink);font-weight:600}
.chip .n{color:var(--faint);font-size:11px;margin-left:5px;font-weight:500}
.chip[aria-pressed=true] .n{color:var(--muted)}

/* ---------------- list ---------------- */
.list{display:flex;flex-direction:column;gap:7px}
.row{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.rowbtn{display:block;width:100%;text-align:left;padding:12px 13px 11px}
.rh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sym{font-size:15px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.co{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch}
.px{text-align:right;flex:0 0 auto}
.px .v{font-size:15.5px;font-weight:600}
.px .c{font-size:12.5px;font-weight:600;margin-top:1px}
.u{color:var(--up)}.d{color:var(--down)}.flat{color:var(--muted)}

/* the position bar: where price sits inside its own 52-week range */
.bar{position:relative;height:24px;margin-top:11px}
.track{position:absolute;left:0;right:0;top:11px;height:3px;border-radius:2px;background:var(--raised);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 13%,transparent)}
.tick{position:absolute;top:5px;width:1.5px;height:15px;border-radius:1px;background:var(--faint)}
.tick.d50{background:#7FB3FF}.tick.d100{background:#C9A2FF}.tick.d200{background:#FFB86B}
.mark{position:absolute;top:6px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg);transform:translateX(-50%)}
.ends{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:-1px;font-variant-numeric:tabular-nums}

.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2.5px 7px;border-radius:5px;background:var(--raised);border:1px solid var(--rule);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag b{font-weight:600}
.tag.above b{color:var(--up)}.tag.below b{color:var(--down)}
.tag.hi{border-color:color-mix(in srgb,var(--up) 42%,transparent);color:var(--up)}
.tag.lo{border-color:color-mix(in srgb,var(--down) 42%,transparent);color:var(--down)}
.tag.warm{border-color:color-mix(in srgb,#FFB86B 42%,transparent);color:#FFB86B}
.tag.na{color:var(--faint);font-style:italic}

/* ---------------- detail ---------------- */
.detail{border-top:1px solid var(--rule);padding:12px 13px 14px;background:var(--raised)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.kv div{background:var(--card);padding:7px 9px}
.kv .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv .n{font-size:13.5px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.nh{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.nh::after{content:'';flex:1;height:1px;background:var(--rule)}
.news{display:flex;flex-direction:column;gap:9px}
.ni{display:flex;gap:9px;align-items:flex-start}
.ni .b{width:4px;height:4px;border-radius:50%;background:var(--lime);margin-top:7px;flex:0 0 auto}
.ni .b.q{background:var(--faint)}
.ni a{color:var(--ink);text-decoration:none;font-size:13px;line-height:1.42}
.ni a:active{opacity:.6}
.ni .s{font-size:11px;color:var(--muted);margin-top:2px}
.quiet{font-size:12.5px;color:var(--faint);font-style:italic}
.spin{font-size:12.5px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:34px 12px}
.err{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
.err button{color:var(--lime);font-weight:600;margin-top:9px;padding:8px 16px;border:1px solid color-mix(in srgb,var(--lime) 42%,transparent);border-radius:9px}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule);font-size:11px;color:var(--faint);line-height:1.6}
.skel{height:96px;border-radius:12px;background:linear-gradient(90deg,var(--card) 25%,var(--raised) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap">
    <div class="top">
      <div class="brand">Levels<i>.</i></div>
      <div class="idx" id="idx"></div>
    </div>
    <div class="statusline" id="status"><span class="dot"></span><span>Loading…</span></div>
    <div class="controls">
      <div class="searchrow"><input type="search" id="q" placeholder="Search symbol, company or sector" autocomplete="off" spellcheck="false" enterkeyhint="search"></div>
      <div class="chips" id="chips" role="group" aria-label="Filters"></div>
    </div>
  </div>
  <div class="hair"></div>
</header>

<main class="wrap">
  <div class="list" id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <footer id="foot"></footer>
</main>

<script>
'use strict';

/* In dev, tool/dev_proxy.py serves this page and /api/* from one origin.
   Hosted, the page lives on GitHub Pages — which is static-only and cannot
   run the NSE proxy — so /api/* comes from the Worker cross-origin (it
   sends Access-Control-Allow-Origin: *). Temporary arrangement: when the
   real domain arrives, page and Worker share an origin and this collapses
   back to location.origin. */
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? location.origin
  : 'https://levels-proxy.marketnudge.workers.dev';
/* NSE republishes roughly every 5s and the proxy caches for 5s, so 10s is
   about as live as this data gets — faster only re-fetches the same number. */
const REFRESH_OPEN_MS = 10_000;      // while the market is open
const REFRESH_SHUT_MS = 5 * 60_000;  // when it is not — the number cannot move
/* The daily layer only changes when a new bar prints, but the page may sit
   open across a close, so re-ask occasionally rather than never. */
const REFRESH_LEVELS_MS = 30 * 60_000;

let IND = null;          // daily levels — committed file, then live-computed
let LIVE = null;         // live prices (via proxy)
let ALIASES = {};        // symbol -> {press_name, aliases, block}
let LEVELS_LIVE = false; // did the live levels call succeed?
let LAST_TICK = null;    // when the live prices last actually arrived
let filter = 'all', query = '', expanded = null;
const newsCache = new Map();

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (n, dp = 2) => n == null || !isFinite(n) ? '—'
  : n.toLocaleString('en-IN', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const pct = n => n == null || !isFinite(n) ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2) + '%';
const dir = n => n > 0 ? 'u' : n < 0 ? 'd' : 'flat';

/* ---------------- filters ----------------
   Each one answers a question worth asking, and each is a plain measurement.
   Nothing here ranks, scores, or suggests. */
const FILTERS = [
  {id:'all',    label:'All'},
  {id:'movers', label:'Moved >1%',   fn:s => Math.abs(s.pct ?? 0) >= 1},
  {id:'nearhi', label:'Near 52w high', fn:s => s.near_year_high != null && s.near_year_high <= 3},
  {id:'nearlo', label:'Near 52w low',  fn:s => s.near_year_low != null && Math.abs(s.near_year_low) <= 3},
  {id:'above',  label:'Above 200D',  fn:s => s.dma200 != null && s.last > s.dma200},
  {id:'below',  label:'Below 200D',  fn:s => s.dma200 != null && s.last < s.dma200},
  {id:'rsihi',  label:'RSI ≥ 70',    fn:s => s.rsi14 != null && s.rsi14 >= 70},
  {id:'rsilo',  label:'RSI ≤ 30',    fn:s => s.rsi14 != null && s.rsi14 <= 30},
];

/* Join the live row and the daily indicators into one object per stock. */
function merge() {
  if (!IND) return [];
  const live = new Map((LIVE?.stocks ?? []).map(s => [s.symbol, s]));
  return IND.stocks.map(d => {
    const l = live.get(d.symbol) || {};
    const last = l.last ?? d.close;
    return {
      // NSE's live feed shouts ("BAJAJ FINANCE LIMITED"); the published
      // constituent list is properly cased. Prefer the readable one.
      symbol: d.symbol, name: d.name || l.name, industry: d.industry,
      last, pct: l.pct ?? null, change: l.change ?? null,
      dma50: d.dma50, dma100: d.dma100, dma200: d.dma200, rsi14: d.rsi14,
      // Prefer NSE's own 52-week figures when live; fall back to ours, which
      // were computed from a different provider and agree with NSE on every
      // symbol checked.
      year_high: l.year_high ?? d.week52?.high ?? null,
      year_low:  l.year_low  ?? d.week52?.low  ?? null,
      near_year_high: l.near_year_high ?? null,
      near_year_low:  l.near_year_low ?? null,
      day_high: l.day_high ?? null, day_low: l.day_low ?? null,
      prev_close: l.prev_close ?? null, volume: l.volume ?? null,
      as_of: d.as_of, stale: !live.has(d.symbol),
    };
  });
}

function visible(rows) {
  const f = FILTERS.find(x => x.id === filter);
  let out = f?.fn ? rows.filter(f.fn) : rows.slice();
  const q = query.trim().toLowerCase();
  if (q) out = out.filter(s =>
    s.symbol.toLowerCase().includes(q) ||
    (s.name || '').toLowerCase().includes(q) ||
    (s.industry || '').toLowerCase().includes(q));
  // Biggest absolute move first — on a page about what moved, that is the
  // order the question implies. Alphabetical when nothing has moved yet.
  return out.sort((a, b) => (Math.abs(b.pct ?? 0) - Math.abs(a.pct ?? 0)) ||
                            a.symbol.localeCompare(b.symbol));
}

/* ---------------- position bar ----------------
   One glance answers "where in its own year is this?" — the 52-week range as
   a track, the three averages as ticks, the price as a dot. */
function bar(s) {
  const lo = s.year_low, hi = s.year_high;
  if (lo == null || hi == null || hi <= lo) return '';
  const at = v => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
  const ticks = [['dma50','d50','50D'],['dma100','d100','100D'],['dma200','d200','200D']]
    .filter(([k]) => s[k] != null)
    .map(([k, cls, lab]) =>
      `<span class="tick ${cls}" style="left:${at(s[k]).toFixed(2)}%" title="${lab} ${num(s[k])}"></span>`)
    .join('');
  const p = at(s.last);
  const col = s.pct > 0 ? 'var(--up)' : s.pct < 0 ? 'var(--down)' : 'var(--ink)';
  // Day range shading, when the exchange gives one.
  const band = (s.day_low != null && s.day_high != null && s.day_high > s.day_low)
    ? `<i style="left:${at(s.day_low).toFixed(2)}%;width:${(at(s.day_high)-at(s.day_low)).toFixed(2)}%"></i>` : '';
  return `<div class="bar" role="img" aria-label="${esc(s.symbol)} at ${num(s.last)} within its 52-week range ${num(lo)} to ${num(hi)}">
      <div class="track">${band}</div>${ticks}
      <span class="mark" style="left:${p.toFixed(2)}%;background:${col}"></span>
    </div>
    <div class="ends"><span>${num(lo, 0)}</span><span>${num(hi, 0)}</span></div>`;
}

function tags(s) {
  const t = [];
  for (const [k, lab] of [['dma50','50D'],['dma100','100D'],['dma200','200D']]) {
    if (s[k] == null) { t.push(`<span class="tag na">${lab} n/a</span>`); continue; }
    const above = s.last >= s[k];
    const gap = ((s.last - s[k]) / s[k]) * 100;
    t.push(`<span class="tag ${above ? 'above' : 'below'}">${lab} <b>${above ? '▲' : '▼'}${Math.abs(gap).toFixed(1)}%</b></span>`);
  }
  if (s.rsi14 != null) {
    const cls = s.rsi14 >= 70 ? 'warm' : s.rsi14 <= 30 ? 'warm' : '';
    t.push(`<span class="tag ${cls}">RSI <b>${s.rsi14.toFixed(0)}</b></span>`);
  }
  if (s.near_year_high != null && s.near_year_high <= 3)
    t.push(`<span class="tag hi">${s.near_year_high <= 0.05 ? 'At' : Math.abs(s.near_year_high).toFixed(1) + '% from'} 52w high</span>`);
  else if (s.near_year_low != null && Math.abs(s.near_year_low) <= 3)
    t.push(`<span class="tag lo">${Math.abs(s.near_year_low) <= 0.05 ? 'At' : Math.abs(s.near_year_low).toFixed(1) + '% from'} 52w low</span>`);
  return t.join('');
}

function rowHtml(s) {
  const open = expanded === s.symbol;
  return `<div class="row" data-sym="${esc(s.symbol)}">
    <button class="rowbtn" aria-expanded="${open}">
      <div class="rh">
        <div style="min-width:0">
          <div class="sym">${esc(s.symbol)}</div>
          <div class="co">${esc(s.name || s.industry || '')}</div>
        </div>
        <div class="px">
          <div class="v">${num(s.last)}</div>
          <div class="c ${dir(s.pct)}">${pct(s.pct)}</div>
        </div>
      </div>
      ${bar(s)}
      <div class="meta">${tags(s)}</div>
    </button>
    ${open ? `<div class="detail" id="d-${esc(s.symbol)}">${detailHtml(s)}</div>` : ''}
  </div>`;
}

function detailHtml(s) {
  const cell = (k, v) => `<div><div class="k">${k}</div><div class="n">${v}</div></div>`;
  return `<div class="kv">
      ${cell('50 DMA', num(s.dma50))}${cell('100 DMA', num(s.dma100))}${cell('200 DMA', num(s.dma200))}
      ${cell('RSI 14', s.rsi14 == null ? '—' : s.rsi14.toFixed(1))}
      ${cell('52w high', num(s.year_high))}${cell('52w low', num(s.year_low))}
      ${cell('Day range', s.day_low == null ? '—' : `${num(s.day_low, 0)}–${num(s.day_high, 0)}`)}
      ${cell('Prev close', num(s.prev_close))}
    </div>
    <div class="nh">Why it moved</div>
    <div class="news" id="n-${esc(s.symbol)}"><span class="spin">Looking for recent coverage…</span></div>`;
}

/* ---------------- news ----------------
   Fetched on demand, never on page load: most rows are never opened, and the
   research showed the useful stories cluster on the stocks that actually moved. */
async function loadNews(sym) {
  const box = document.getElementById('n-' + sym);
  if (!box) return;
  if (newsCache.has(sym)) { box.innerHTML = newsCache.get(sym); return; }

  const a = ALIASES[sym] || {};
  const press = a.press_name || sym;
  // Quote the name — unquoted queries leak into other companies sharing a
  // token. `when:2d` is what makes results recent: the feed sorts by
  // relevance, so without it the top hit can be weeks old.
  const q = `"${press}" shares when:2d`;
  try {
    const r = await fetch(`${API}/api/news?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    const names = (a.aliases && a.aliases.length ? a.aliases : [press, sym]).map(x => x.toLowerCase());
    const block = (a.block || []).map(x => x.toLowerCase());
    // Requiring the company name in the *headline* is the feature, not polish:
    // roughly 60% of returned items are unrelated backfill, because the search
    // pads thin queries rather than returning fewer results.
    const items = data.items.filter(it => {
      const t = it.title.toLowerCase();
      return names.some(n => t.includes(n)) && !block.some(b => t.includes(b));
    }).slice(0, 6);

    const html = items.length
      ? items.map(it => {
          const causal = /\bwhy\b|explained|behind|surge|slump|fell|falls|jump|crash|sell-?off|tank|rally|\d+%/i.test(it.title);
          return `<div class="ni"><span class="b ${causal ? '' : 'q'}"></span><div>
            <a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.title.replace(/\s+-\s+[^-]+$/, ''))}</a>
            <div class="s">${esc(it.source || 'Google News')}${it.published ? ' · ' + esc(ago(it.published)) : ''}</div>
          </div></div>`;
        }).join('')
      : `<div class="quiet">No stock-specific news in the last two days.</div>`;
    newsCache.set(sym, html);
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="quiet">Couldn't load news (${esc(e.message)}).</div>`;
  }
}

function ago(s) {
  const t = Date.parse(s);
  if (!isFinite(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return `${Math.max(m, 1)} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} hr ago`;
  return `${Math.round(m / 1440)} d ago`;
}

/* ---------------- render ---------------- */
function render() {
  const rows = merge();
  const shown = visible(rows);

  $('#chips').innerHTML = FILTERS.map(f => {
    const n = f.fn ? rows.filter(f.fn).length : rows.length;
    return `<button class="chip" data-f="${f.id}" aria-pressed="${filter === f.id}">${f.label}<span class="n">${n}</span></button>`;
  }).join('');

  const list = $('#list');
  list.innerHTML = shown.length
    ? shown.map(rowHtml).join('')
    : `<div class="empty">Nothing matches.</div>`;
  if (expanded && shown.some(s => s.symbol === expanded)) loadNews(expanded);

  if (LIVE?.index) {
    // Name the index. The feed is NIFTY 500 now that the watchlist is not an
    // index, and an unlabelled number here reads as the NIFTY 50 everyone
    // assumes — a benchmark that is not the one being shown.
    $('#idx').innerHTML = `<div class="nm">${esc(LIVE.index.symbol || 'Index')}</div>
      <div class="v">${num(LIVE.index.last)}</div>
      <div class="c ${dir(LIVE.index.pct)}">${pct(LIVE.index.pct)}</div>`;
  }
  const open = (LIVE?.market_status || '').toLowerCase().includes('open');
  const b = LIVE?.breadth;
  $('#status').innerHTML =
    `<span class="dot ${open ? 'open' : ''}"></span>
     <span>${open ? 'Market open' : 'Market closed'}${LIVE?.as_of ? ' · ' + esc(LIVE.as_of) : ''}</span>
     <span class="sp">${b ? `${b.advances} up / ${b.declines} down · ` : ''}<span id="age"></span></span>`;
  paintAge();

  const missing = LIVE?.missing?.length
    ? `<br><b style="color:#FFB86B">No live price for ${LIVE.missing.map(esc).join(', ')}</b> — outside the NIFTY 500 feed; showing last close.`
    : '';
  $('#foot').innerHTML =
    `Levels from the ${esc(IND?.as_of || '—')} close${LEVELS_LIVE ? '' : ' (last published build)'} · prices from NSE · ${shown.length} of ${rows.length} shown.<br>
     Averages and RSI are computed from daily closes. News is shown near a move, not as its cause.
     Measurements only — not investment advice, and not SEBI-registered.${missing}`;
}

/* ---------------- data ---------------- */
async function loadStatic() {
  const [ind, ali] = await Promise.all([
    fetch('data/indicators.json', {cache: 'no-cache'}).then(r => r.json()),
    fetch('data/news_aliases.json', {cache: 'no-cache'}).then(r => r.json()).catch(() => ({stocks: []})),
  ]);
  IND = ind;
  ALIASES = Object.fromEntries((ali.stocks || []).map(s => [s.symbol, s]));
}

/* Levels computed live from the latest close.
   The committed file is loaded first so the page paints immediately, then
   this replaces it — the file is only as fresh as the last deploy, and this
   is always the newest printed bar. Failure keeps the file, which is why
   the footer names the session the levels came from rather than implying
   they are current. */
async function loadLevels() {
  try {
    const r = await fetch(`${API}/api/indicators`, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const fresh = await r.json();
    if (fresh?.stocks?.length && (!IND || fresh.as_of >= IND.as_of)) {
      IND = fresh;
      LEVELS_LIVE = true;
    }
  } catch (e) {
    console.warn('live levels unavailable, using the committed file', e);
  }
}

async function loadLive() {
  try {
    // Ask only for what the watchlist names. The upstream index carries 500
    // companies; sending 500 rows to a phone every minute would be waste.
    const syms = (IND?.stocks ?? []).map(s => s.symbol).join(',');
    const r = await fetch(`${API}/api/live?symbols=${encodeURIComponent(syms)}`, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    LIVE = await r.json();
    LAST_TICK = Date.now();
  } catch (e) {
    // Keep the last good prices rather than blanking the page — a stale number
    // with a visible timestamp beats an empty screen.
    console.warn('live fetch failed', e);
  }
}

function schedule() {
  const open = (LIVE?.market_status || '').toLowerCase().includes('open');
  clearTimeout(schedule.t);
  schedule.t = setTimeout(async () => { await loadLive(); render(); schedule(); },
                          open ? REFRESH_OPEN_MS : REFRESH_SHUT_MS);

  // The daily layer on its own, much slower clock — it only moves when a new
  // bar prints, but a page left open across a close should pick it up.
  clearTimeout(schedule.lv);
  schedule.lv = setTimeout(async () => { await loadLevels(); render(); },
                           REFRESH_LEVELS_MS);

  // Tick the "updated Xs ago" readout between fetches, so the page shows its
  // own staleness rather than looking equally current a second and an hour
  // after the last successful call.
  clearInterval(schedule.age);
  schedule.age = setInterval(paintAge, 1000);
}

function paintAge() {
  const el = document.getElementById('age');
  if (!el || !LAST_TICK) return;
  const s = Math.round((Date.now() - LAST_TICK) / 1000);
  el.textContent = s < 2 ? 'just now'
    : s < 60 ? `${s}s ago`
    : s < 3600 ? `${Math.round(s / 60)}m ago`
    : `${Math.round(s / 3600)}h ago`;
  // Past twice the expected interval something is wrong; say so quietly.
  const open = (LIVE?.market_status || '').toLowerCase().includes('open');
  el.classList.toggle('stale', s * 1000 > (open ? REFRESH_OPEN_MS : REFRESH_SHUT_MS) * 2.5);
}

/* ---------------- events ---------------- */
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const sym = row.dataset.sym;
  expanded = expanded === sym ? null : sym;
  render();
  if (expanded === sym) {
    const el = document.querySelector(`.row[data-sym="${CSS.escape(sym)}"]`);
    if (el && el.getBoundingClientRect().top < 90) el.scrollIntoView({block: 'center', behavior: 'smooth'});
  }
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  filter = b.dataset.f;
  render();
});
let qt; $('#q').addEventListener('input', e => {
  clearTimeout(qt);
  qt = setTimeout(() => { query = e.target.value; render(); }, 120);
});
addEventListener('scroll', () => $('#hdr').classList.toggle('stuck', scrollY > 4), {passive: true});
// A phone spends most of its life with the tab backgrounded; refresh on return
// rather than letting the interval quietly drift.
addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') { await loadLive(); render(); schedule(); }
});

(async function init() {
  try {
    await loadStatic();
  } catch (e) {
    $('#list').innerHTML = `<div class="err">Couldn't load the levels file.<br><small>${esc(e.message)}</small>
      <br><button onclick="location.reload()">Retry</button></div>`;
    return;
  }
  await loadLive();
  render();                 // paint with the committed levels immediately
  schedule();
  await loadLevels();       // then swap in levels from the latest close
  render();
})();
</script>
</body>
</html>
